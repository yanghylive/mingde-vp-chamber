openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Mingde VP Chamber API
  version: 0.5.0
  summary: Chamber overlay G0 runtime and G1 member, verification, and membership-checkout verticals
  description: |
    This document is the source-controlled contract for the independently developed
    Chamber API overlay. Runtime behavior is defined by the locked CRMEB v6.0.0
    source plus `backend/custom/app/chamber`.

    Every operation declares `x-implementation-status`. G0 routes, authenticated
    member bootstrap, profile, graduate-verification, membership-plan, and
    membership-checkout operations marked `implemented` are live. The remaining
    G1 membership-summary route marked `planned` freezes the G1-01E contract and
    MUST NOT be represented as runtime-delivered yet.

    All response envelopes contain `status`, `msg`, `data`, and `request_id`.
    The G0 request tracing middleware returns independent request/correlation IDs
    in response headers and preserves the request ID in the JSON envelope.
  contact:
    name: mingde-vp-chamber project
  license:
    name: Private project contract
servers:
  - url: http://localhost:8011
    description: Local Docker baseline
tags:
  - name: System
    description: Process-level probes that do not require tenant context.
  - name: Bootstrap
    description: Tenant-aware application bootstrap.
  - name: Member
    description: Authenticated tenant member, profile, and graduate verification.
  - name: Membership
    description: Tenant/channel membership plans and effective entitlement summary.
  - name: Administration
    description: Tenant-scoped operator review commands guarded by CRMEB admin authentication.
x-contract-policy:
  source-of-truth: backend/custom/openapi/chamber-openapi.yaml
  upstream-baseline: CRMEB-KY v6.0.0 at 7dcddffff73ec542d689f159724296351f29ea9a
  operation-status-required: true
  implemented-paths-only: false
  response-envelope-required:
    - status
    - msg
    - data
    - request_id
  timestamp-unit: unix_seconds
  timestamp-timezone: UTC
  money-transport: decimal_string
  default-currency: CNY
paths:
  /chamber/health:
    get:
      tags:
        - System
      summary: Check Chamber application health
      description: |
        Public liveness probe. It proves that the Chamber ThinkPHP application can
        route and return JSON; it does not prove MySQL, Redis, or tenant readiness.
      operationId: getChamberHealth
      x-implementation-status: implemented
      security: []
      x-requirement-id: G0-API-01
      x-tenant-context: none
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          $ref: '#/components/responses/HealthSuccess'
        '403':
          $ref: '#/components/responses/TenantForbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /chamber/v1/bootstrap:
    get:
      tags:
        - Bootstrap
      summary: Resolve the trusted tenant and channel context
      description: |
        Returns the tenant/channel scope resolved by middleware. Resolution uses a
        configured Host mapping or the complete signed header set. Raw `tenant_id`
        and `channel_id` request values are never trusted.

        When any `X-Chamber-*` signed header is present, all five signed headers are
        mandatory. The HMAC-SHA256 input is the following newline-delimited string:
        `METHOD`, normalized host, normalized path, tenant slug, channel code,
        10-digit Unix timestamp, and nonce. The signature is lowercase hex.
      operationId: getChamberBootstrap
      x-implementation-status: implemented
      security: []
      x-requirement-id: G0-API-02
      x-tenant-context: required
      x-signed-headers-all-or-none: true
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/ChamberTenantHeader'
        - $ref: '#/components/parameters/ChamberChannelHeader'
        - $ref: '#/components/parameters/ChamberTimestampHeader'
        - $ref: '#/components/parameters/ChamberNonceHeader'
        - $ref: '#/components/parameters/ChamberSignatureHeader'
      responses:
        '200':
          $ref: '#/components/responses/BootstrapSuccess'
        '400':
          $ref: '#/components/responses/TenantBadRequest'
        '401':
          $ref: '#/components/responses/TenantUnauthorized'
        '403':
          $ref: '#/components/responses/TenantForbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/TenantServiceUnavailable'
  /chamber/v1/me/bootstrap:
    post:
      tags:
        - Member
      summary: Bootstrap the authenticated member inside the trusted tenant
      operationId: bootstrapChamberMember
      security:
        - CrmebBearerAuth: []
      x-implementation-status: implemented
      x-requirement-id: MEM-001,MEM-009
      x-tenant-context: required
      x-signed-headers-all-or-none: true
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/ChamberTenantHeader'
        - $ref: '#/components/parameters/ChamberChannelHeader'
        - $ref: '#/components/parameters/ChamberTimestampHeader'
        - $ref: '#/components/parameters/ChamberNonceHeader'
        - $ref: '#/components/parameters/ChamberSignatureHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberBootstrapRequest'
      responses:
        '200':
          $ref: '#/components/responses/MemberBootstrapSuccess'
        '400':
          $ref: '#/components/responses/ChamberRequestError'
        '401':
          $ref: '#/components/responses/ChamberRequestError'
        '403':
          $ref: '#/components/responses/ChamberRequestError'
        '409':
          $ref: '#/components/responses/MemberTransactionError'
        '422':
          $ref: '#/components/responses/MemberTransactionError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/TenantServiceUnavailable'
