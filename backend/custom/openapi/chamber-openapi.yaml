      required:
        - action
      properties:
        action:
          $ref: '#/components/schemas/GraduateVerificationReviewAction'
        note:
          type: string
          maxLength: 500
      allOf:
        - if:
            properties:
              action:
                enum: [return, reject, revoke]
          then:
            required:
              - note
            properties:
              note:
                minLength: 1
    GraduateVerificationReviewEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelopeBase'
        - type: object
          required:
            - data
          properties:
            status:
              const: 200
            msg:
              const: ok
            data:
              $ref: '#/components/schemas/GraduateVerificationAdminApplication'
    MembershipPlanTier:
      type: string
      enum:
        - L3
        - L4
    MembershipDurationUnit:
      type: string
      enum:
        - year
    MembershipPlanSummary:
      type: object
      additionalProperties: false
      required:
        - code
        - version
        - name
        - tier
        - price
        - currency
        - duration_value
        - duration_unit
        - benefits
        - eligible
        - ineligible_reason
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
        version:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 80
        tier:
          $ref: '#/components/schemas/MembershipPlanTier'
        price:
          $ref: '#/components/schemas/MoneyAmount'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        duration_value:
          type: integer
          const: 1
        duration_unit:
          $ref: '#/components/schemas/MembershipDurationUnit'
        benefits:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 200
        eligible:
          type: boolean
        ineligible_reason:
          oneOf:
            - $ref: '#/components/schemas/MemberTransactionErrorCode'
            - type: 'null'
    MembershipTermStatus:
      type: string
      enum:
        - scheduled
        - active
        - expired
        - revoked
        - refunded
      description: Computed from immutable fact state and the half-open effective interval.
    MembershipTermSummary:
      type: object
      additionalProperties: false
      required:
        - term_no
        - tier
        - plan_code
        - plan_version
        - status
        - starts_at
        - ends_at
        - source_order_no
      properties:
        term_no:
          type: string
          minLength: 1
          maxLength: 32
        tier:
          $ref: '#/components/schemas/MembershipPlanTier'
        plan_code:
          type: string
          minLength: 1
          maxLength: 32
        plan_version:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/MembershipTermStatus'
        starts_at:
          $ref: '#/components/schemas/UnixTimestampSeconds'
        ends_at:
          $ref: '#/components/schemas/UnixTimestampSeconds'
        source_order_no:
          type: string
          minLength: 1
          maxLength: 64
    MembershipSummaryData:
      type: object
      additionalProperties: false
      required:
        - effective_tier
        - verification_status
        - tier_expires_at
        - current_term
        - active_terms
        - can_purchase
      properties:
        effective_tier:
          $ref: '#/components/schemas/MembershipTier'
        verification_status:
          $ref: '#/components/schemas/GraduateVerificationStatus'
        tier_expires_at:
          $ref: '#/components/schemas/UnixTimestampSeconds'
        current_term:
          oneOf:
            - $ref: '#/components/schemas/MembershipTermSummary'
            - type: 'null'
        active_terms:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/MembershipTermSummary'
        can_purchase:
          type: boolean
    MembershipPlansData:
      type: object
      additionalProperties: false
      required:
        - plans
      properties:
        plans:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/MembershipPlanSummary'
    MembershipPlansEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelopeBase'
        - type: object
          required:
            - data
          properties:
            status:
              const: 200
            msg:
              const: ok
            data:
              $ref: '#/components/schemas/MembershipPlansData'
    MembershipCheckoutRequest:
      type: object
      additionalProperties: false
      required:
        - plan_code
        - plan_version
        - expected_amount
        - currency
      properties:
        plan_code:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
        plan_version:
          type: integer
          minimum: 1
        expected_amount:
          $ref: '#/components/schemas/MoneyAmount'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
    MembershipCheckoutData:
      type: object
      additionalProperties: false
      required:
        - context_no
        - order_no
        - order_status
        - payable_amount
        - currency
        - payment_required
        - replayed
      properties:
        context_no:
          type: string
          minLength: 1
          maxLength: 32
        order_no:
          type: string
          minLength: 1
          maxLength: 64
        order_status:
          $ref: '#/components/schemas/OrderLifecycleStatus'
        payable_amount:
          $ref: '#/components/schemas/MoneyAmount'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        payment_required:
          type: boolean
        replayed:
          type: boolean
    MembershipCheckoutEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelopeBase'
        - type: object
          required:
            - data
          properties:
            status:
              const: 201
            msg:
              const: created
            data:
              $ref: '#/components/schemas/MembershipCheckoutData'
    MembershipSummaryEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelopeBase'
        - type: object
          required:
            - data
          properties:
            status:
              const: 200
            msg:
              const: ok
            data:
              $ref: '#/components/schemas/MembershipSummaryData'
    MemberTransactionErrorCode:
      type: string
      enum:
        - authentication_required
        - permission_denied
        - idempotency_key_required
        - idempotency_conflict
        - request_validation_failed
        - member_not_found
        - member_disabled
        - member_attribution_locked
        - invite_code_invalid
        - profile_invalid
        - unsupported_media_type
        - asset_upload_invalid
        - asset_quota_exceeded
        - proof_asset_invalid
        - asset_already_consumed
        - asset_not_found
        - asset_integrity_failed
        - tenant_scope_denied
        - consent_document_stale
        - verification_already_pending
        - verification_application_not_found
        - verification_transition_invalid
        - verification_supersedes_mismatch
        - membership_verification_required
        - membership_plan_unavailable
        - membership_downgrade_not_allowed
        - membership_order_inconsistent
        - membership_order_unavailable
    FieldError:
      type: object
      additionalProperties: false
      required:
        - field
        - code
      properties:
        field:
          type: string
          minLength: 1
          maxLength: 128
        code:
          type: string
          minLength: 1
          maxLength: 64
    MemberTransactionErrorData:
      type: object
      additionalProperties: false
      required:
        - reason
        - field_errors
      properties:
        reason:
          $ref: '#/components/schemas/MemberTransactionErrorCode'
        field_errors:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/FieldError'
    MemberTransactionErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/MemberTransactionErrorData'
    ChamberRequestErrorEnvelope:
      oneOf:
        - $ref: '#/components/schemas/TenantErrorEnvelope'
        - $ref: '#/components/schemas/MemberTransactionErrorEnvelope'
