server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    client_max_body_size 100M;
    root /var/www/public;

    location / {
        proxy_set_header X-Forwarded-Host $host;
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?s=$1 last;
            break;
        }
    }

    location ~ ^/chamber/v1/me/assets/?$ {
        client_max_body_size 11M;
        error_page 413 = @chamber_asset_too_large;
        rewrite ^(.*)$ /index.php?s=$1 last;
    }

    location @chamber_asset_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Request-Id $request_id always;
        add_header X-Correlation-Id $request_id always;
        return 413 '{"status":413,"msg":"payload too large","data":{"reason":"asset_upload_invalid","field_errors":[{"field":"file","code":"too_large"}]},"request_id":"$request_id"}';
    }

    location /notice {
        proxy_pass http://192.168.11.90:40001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-real-ip $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /msg {
        proxy_pass http://192.168.11.90:40002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-real-ip $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location ~ \.php$ {
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass phpfpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ {
        expires 30d;
        error_log off;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$ {
        expires 12h;
        error_log off;
        access_log /dev/null;
    }
}
