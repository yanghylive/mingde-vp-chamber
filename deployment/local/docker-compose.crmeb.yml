services:
  mysql:
    container_name: mingde_crmeb_mysql
    image: ccr.ccs.tencentyun.com/crmebky_php/mysql:v8.0.45
    command:
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    ports:
      - "127.0.0.1:${CRMEB_MYSQL_PORT:-33061}:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${CRMEB_MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_USER: ${CRMEB_DB_USER:-crmeb}
      MYSQL_PASSWORD: ${CRMEB_DB_PASSWORD:-123456}
      MYSQL_DATABASE: ${CRMEB_DB_NAME:-crmeb}
    volumes:
      - ./.data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      chamber_net:
        ipv4_address: 192.168.11.11

  redis:
    container_name: mingde_crmeb_redis
    image: ccr.ccs.tencentyun.com/crmebky_php/redis:v8.6.1
    ports:
      - "127.0.0.1:${CRMEB_REDIS_PORT:-63791}:6379"
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${CRMEB_REDIS_PASSWORD:-123456}
    volumes:
      - ./.data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping 2>/dev/null | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      chamber_net:
        ipv4_address: 192.168.11.10

  phpfpm:
    container_name: mingde_crmeb_php
    image: ccr.ccs.tencentyun.com/crmebky_php/php:v7.4
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST_IP: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${CRMEB_DB_USER:-crmeb}
      MYSQL_PASSWORD: ${CRMEB_DB_PASSWORD:-123456}
      MYSQL_DATABASE: ${CRMEB_DB_NAME:-crmeb}
      REDIS_HOST_IP: redis
      REDIS_PORT: "6379"
      REDIS_DATABASE: "0"
      REDIS_PASSWORD: ${CRMEB_REDIS_PASSWORD:-123456}
      APP_DEBUG: "true"
      DEFAULT_TIMEZONE: Asia/Shanghai
      CHAMBER_ENV: local
      CHAMBER_DEV_LOCALHOST_ENABLED: "true"
      CHAMBER_DEV_TENANT_SLUG: ${CHAMBER_DEV_TENANT_SLUG:-local-primary}
      CHAMBER_DEV_CHANNEL_CODE: ${CHAMBER_DEV_CHANNEL_CODE:-default}
      CHAMBER_TENANT_SIGNING_SECRET: ${CHAMBER_TENANT_SIGNING_SECRET:-local-only-tenant-signing-secret-32-bytes}
      CHAMBER_TENANT_SIGNATURE_TTL: ${CHAMBER_TENANT_SIGNATURE_TTL:-300}
      CHAMBER_CORS_ALLOWED_ORIGINS: ${CHAMBER_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      CHAMBER_CORS_ALLOW_CREDENTIALS: ${CHAMBER_CORS_ALLOW_CREDENTIALS:-true}
    expose:
      - "9000"
      - "40001"
      - "40002"
    working_dir: /var/www
    volumes:
      - ../../.build-workspace/crmeb-runtime:/var/www
      - ./.data/runtime:/var/www/runtime
      - ./.data/uploads:/var/www/public/uploads
    networks:
      chamber_net:
        ipv4_address: 192.168.11.90

  nginx:
    container_name: mingde_crmeb_nginx
    image: ccr.ccs.tencentyun.com/crmebky_php/nginx:v1.29.6
    restart: unless-stopped
    depends_on:
      - phpfpm
    ports:
      - "127.0.0.1:${CRMEB_HTTP_PORT:-8011}:80"
    working_dir: /var/www
    volumes_from:
      - phpfpm
    volumes:
      - ./nginx-vhost.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.data/nginx-log:/etc/nginx/log
    networks:
      chamber_net:
        ipv4_address: 192.168.11.80

networks:
  chamber_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.11.0/24
