services:
  mysql:
    container_name: mingde_crmeb_mysql
    image: ccr.ccs.tencentyun.com/crmebky_php/mysql:v8.0.45
    ports:
      - "33061:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_USER: crmeb
      MYSQL_PASSWORD: 123456
      MYSQL_DATABASE: crmeb
    volumes:
      - ./.data/mysql:/var/lib/mysql
    networks:
      chamber_net:
        ipv4_address: 192.168.11.11

  redis:
    container_name: mingde_crmeb_redis
    image: ccr.ccs.tencentyun.com/crmebky_php/redis:v8.6.1
    ports:
      - "63791:6379"
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: 123456
    volumes:
      - ./.data/redis:/data
    networks:
      chamber_net:
        ipv4_address: 192.168.11.10

  phpfpm:
    container_name: mingde_crmeb_php
    image: ccr.ccs.tencentyun.com/crmebky_php/php:v7.4
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST_IP: mingde_crmeb_mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: crmeb
      MYSQL_PASSWORD: 123456
      MYSQL_DATABASE: crmeb
      REDIS_HOST_IP: mingde_crmeb_redis
      REDIS_PORT: "6379"
      REDIS_DATABASE: "0"
      REDIS_PASSWORD: 123456
      APP_DEBUG: "true"
      DEFAULT_TIMEZONE: Asia/Shanghai
    ports:
      - "9000:9000"
      - "40001:40001"
      - "40002:40002"
    working_dir: /var/www
    volumes:
      - ../../backend/crmeb/crmeb:/var/www
      - ./.data/runtime:/var/www/runtime
      - ./.data/uploads:/var/www/public/uploads
    networks:
      chamber_net:
        ipv4_address: 192.168.11.90

  nginx:
    container_name: mingde_crmeb_nginx
    image: ccr.ccs.tencentyun.com/crmebky_php/nginx:v1.29.6
    restart: unless-stopped
    depends_on:
      - phpfpm
    ports:
      - "8011:80"
    working_dir: /var/www
    volumes_from:
      - phpfpm
    volumes:
      - ./nginx-vhost.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.data/nginx-log:/etc/nginx/log
    networks:
      chamber_net:
        ipv4_address: 192.168.11.80

networks:
  chamber_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.11.0/24
