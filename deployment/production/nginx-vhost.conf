# ============================================================
# md.kaypal.cn 生产 vhost —— 安全加固版（2026-08-08）
# 说明：
#  1) 本文件包含 server 块，若部署时 include 到 nginx http 上下文，
#     顶层的 limit_req_zone 直接生效；若 nginx -t 报 duplicate zone，
#     把 limit_req_zone 行挪到 nginx.conf 的 http 块即可。
#  2) 若 md.kaypal.cn 前面有 CDN/SLB 终结 TLS，则 80 块足够；
#     否则必须启用下方注释的 443 块（强制 HTTPS + HSTS）。
# ============================================================

# 全局限流 zone（http 级定义）：每 IP 每分钟 60 次，burst 20
limit_req_zone $binary_remote_addr zone=chamber_global:10m rate=600r/m;

# 内网后端 upstream（集中管理，避免 location 里散落 IP 暴露内网拓扑）
upstream chamber_chat_backend {
    server 192.168.21.1:8091;
}
upstream chamber_notice_backend {
    server 192.168.21.90:40001;
}
upstream chamber_msg_backend {
    server 192.168.21.90:40002;
}

server {
    listen 80;
    index index.html index.php;
    server_name md.kaypal.cn;
    client_max_body_size 100M;
    root /var/www/public;

    # 关闭版本号泄露
    server_tokens off;

    # ---- 安全响应头（server 级，location 无 add_header 时自动继承）----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # CSP：兼容 vue/webpack 产物（unsafe-inline/unsafe-eval），frame-ancestors 防点击劫持
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    # 注意：add_header 不跨 location 继承。若某 location 自带 add_header，
    # 需在该 location 内补全上列安全头（已对 @chamber_asset_too_large 处理）。

    # ---- 敏感文件拦截（.env / .git / 版本控制 / 框架运行时目录）----
    location ~ /\.(env|git|svn|hg|htaccess|DS_Store) { deny all; return 403; }
    location ~ ^/(runtime|storage|backup|logs)/ { deny all; return 403; }

    # AI 对话后端（DashScope，SSE 流式）
    location ^~ /api/chamber/v1/chat {
        limit_req zone=chamber_global burst=60 nodelay;
        proxy_pass http://chamber_chat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # chamber 应用（兼容小程序 /api 前缀 -> 去前缀转发给 chamber 路由）
    location ^~ /api/chamber/ {
        limit_req zone=chamber_global burst=60 nodelay;
        rewrite ^/api/chamber/(.*)$ /chamber/$1 last;
    }

    location ^~ /admin/ {
        limit_req zone=chamber_global burst=60 nodelay;
        # 强制 html 每次回源验证（SPA index.html 不带 hash，必须 no-cache 防浏览器缓存旧版）
        add_header Cache-Control "no-cache, max-age=0" always;
        try_files $uri $uri/ @admin_spa;
    }
    location @admin_spa {
        rewrite ^/admin/(.*)$ /admin/index.html last;
    }

    location / {
        proxy_set_header X-Forwarded-Host $host;
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?s=$1 last;
            break;
        }
    }

    location ~ ^/chamber/v1/me/assets/?$ {
        client_max_body_size 11M;
        error_page 413 = @chamber_asset_too_large;
        rewrite ^(.*)$ /index.php?s=$1 last;
    }

    location @chamber_asset_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        add_header X-Request-Id $request_id always;
        add_header X-Correlation-Id $request_id always;
        return 413 '{"status":413,"msg":"payload too large","data":{"reason":"asset_upload_invalid","field_errors":[{"field":"file","code":"too_large"}]},"request_id":"$request_id"}';
    }

    location /notice {
        proxy_pass http://chamber_notice_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-real-ip $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /msg {
        proxy_pass http://chamber_msg_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-real-ip $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location ~ \.php$ {
        limit_req zone=chamber_global burst=60 nodelay;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass phpfpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ {
        expires 30d;
        error_log off;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$ {
        expires 12h;
        error_log off;
        access_log /dev/null;
    }
}

