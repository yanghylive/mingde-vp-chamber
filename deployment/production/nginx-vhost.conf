server {
    listen 80;
    index index.html index.php;
    server_name md.kaypal.cn;
    client_max_body_size 100M;
    root /var/www/public;

    # AI 对话后端（DashScope，SSE 流式）
    # AI 对话后端（DashScope，SSE 流式）- ^~ 前缀匹配确保优先于 /api/chamber/ 通用规则
    location ^~ /api/chamber/v1/chat {
        proxy_pass http://192.168.21.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Authori-zation $http_authori_zation;
        proxy_set_header Authorization $http_authori_zation;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # admin SPA history 路由 fallback（vue-router history 模式）
    # chamber 应用（兼容小程序 /api 前缀 -> 去前缀转发给 chamber 路由）
    location ^~ /api/chamber/ {
        rewrite ^/api/chamber/(.*)$ /chamber/$1 last;
    }

    location ^~ /admin/ {
        try_files $uri $uri/ @admin_spa;
    }
    location @admin_spa {
        rewrite ^/admin/(.*)$ /admin/index.html last;
    }


    location / {
        proxy_set_header X-Forwarded-Host $host;
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?s=$1 last;
            break;
        }
    }

    location ~ ^/chamber/v1/me/assets/?$ {
        client_max_body_size 11M;
        error_page 413 = @chamber_asset_too_large;
        rewrite ^(.*)$ /index.php?s=$1 last;
    }

    location @chamber_asset_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Request-Id $request_id always;
        add_header X-Correlation-Id $request_id always;
        return 413 '{"status":413,"msg":"payload too large","data":{"reason":"asset_upload_invalid","field_errors":[{"field":"file","code":"too_large"}]},"request_id":"$request_id"}';
    }

    location /notice {
        proxy_pass http://192.168.21.90:40001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-real-ip $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /msg {
        proxy_pass http://192.168.21.90:40002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-real-ip $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location ~ \.php$ {
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass phpfpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ {
        expires 30d;
        error_log off;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$ {
        expires 12h;
        error_log off;
        access_log /dev/null;
    }
}
